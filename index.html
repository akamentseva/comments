<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
          id="input"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button" id="button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>

    "use strict";

        const comments = [
            {
                name: "Глеб Фокин",
                date: "12.02.22 12:18",
                text: "Это будет первый комментарий на этой странице",
                likes: 3,
                isLiked: false,
            },
            {
                name: "Варвара Н.",
                date: "13.02.22 19:22",
                text: "Мне нравится как оформлена эта страница! ❤",
                likes: 75,
                isLiked: true,
            },
        ];

        const commentsList = document.querySelector(".comments");
        const nameInput = document.getElementById("input");
        const textInput = document.querySelector(".add-form-text");
        const addButton = document.getElementById("button");
        
        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;");
        }

        function renderComments() {
            const html = comments
                .map((comment, index) => {
                    const likeClass = comment.isLiked ? "-active-like" : "";
                    return `
                        <li class="comment" data-index="${index}">
                            <div class="comment-header">
                                <div>${escapeHtml(comment.name)}</div>
                                <div>${escapeHtml(comment.date)}</div>
                            </div>
                            <div class="comment-body">
                                <div class="comment-text">${escapeHtml(comment.text)}</div>
                            </div>
                            <div class="comment-footer">
                                <div class="likes">
                                    <span class="likes-counter">${comment.likes}</span>
                                    <button class="like-button ${likeClass}"></button>
                                </div>
                            </div>
                        </li>
                    `;
                })
                .join("");

            commentsList.innerHTML = html;
        }

        renderComments();

        
        commentsList.addEventListener("click", (event) => {
            
            const likeButton = event.target.closest(".like-button");
            if (likeButton) {
                const commentEl = likeButton.closest(".comment");
                const index = Number(commentEl.dataset.index);
                const comment = comments[index];

                if (comment.isLiked) {
                    comment.likes -= 1;
                    comment.isLiked = false;
                } else {
                    comment.likes += 1;
                    comment.isLiked = true;
                }

                renderComments();
                return;
            }

            
            const commentEl = event.target.closest(".comment");
            if (!commentEl) return;

            const index = Number(commentEl.dataset.index);
            const comment = comments[index];

            nameInput.value = comment.name;
            textInput.value = `> ${comment.text}\n\n`;
            textInput.focus();

            
            checkInputs();
        });

        
        function checkInputs() {
            const name = nameInput.value.trim();
            const text = textInput.value.trim();
            addButton.disabled = !(name !== "" && text !== "");
        }

        nameInput.addEventListener("input", checkInputs);
        textInput.addEventListener("input", checkInputs);
        addButton.disabled = true;

        
        addButton.addEventListener("click", function () {
            const name = nameInput.value.trim();
            const text = textInput.value.trim();

            if (name === "" || text === "") {
                alert("Заполните оба поля!");
                return;
            }

            const now = new Date();
            const day = String(now.getDate()).padStart(2, "0");
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const year = String(now.getFullYear()).slice(2);
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const dateString = `${day}.${month}.${year} ${hours}:${minutes}`;

            comments.push({
                name: name,
                date: dateString,
                text: text,
                likes: 0,
                isLiked: false,
            });

            renderComments();

            nameInput.value = "";
            textInput.value = "";
            addButton.disabled = true;
        });

        console.log("It works!");
  </script>
</html>
